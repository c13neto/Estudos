<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Adalberto">
    <meta name="description" content="Site teste avaliativo da Ford">
    <meta name="keywords" content="ford, html, css">
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <title>Ford - Contato</title>
</head>

<body>

    <header>
        <a href="../index.html"><img src="../public/logo-ford-256.png" alt="Ford logo"></a>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../pages/lancamento.html">Lançamento</a>
            <a href="../pages/contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <div class="contato-content">
            <img src="../public/xls 2.2 diesel.jpg" alt="Ford Ranger XLS">
            <form>
                <p>Sobre Você</p>
                <input type="text" placeholder="NOME*" required>
                <input type="text" placeholder="SOBRENOME*" required>
                <input type="email" placeholder="E-MAIL*" required>

                <input type="tel" placeholder="TELEFONE*" required>

                <select required>
                    <option value="" selected disabled hidden>TIPO DE CONTATO*</option>
                    <option>Elogio</option>
                    <option>Reclamação</option>
                    <option>Solicitação</option>
                </select>

                <textarea placeholder="MENSAGEM*" rows="5" required></textarea>

                <button class="botao" type="submit">Enviar</button>
            </form>
        </div>
    </main>

    <footer>
        <address>
            <p>Redes Sociais</p>
            <a href="https://www.facebook.com/FordBrasil/?locale=pt_BR"><img src="../public/facebook-50.png"
                    alt="Facebook logo"></a>
            <a href="https://www.youtube.com/fordbrasil"><img src="../public/youtube-squared-50.png"
                    alt="Youtube logo"></a>
            <a href="https://www.instagram.com/fordbrasil/"><img src="../public/instagram-logo-50.png"
                    alt="Instagram logo"></a>
        </address>
        <p class="copyright">&copy; 2022 Ford. Todos os direitos reservados.</p>
        <img src="../public/ford-96.png" alt="Ford logo antiga">
    </footer>

</body>

</html>
