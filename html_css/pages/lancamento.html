<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Adalberto">
    <meta name="description" content="Site teste avaliativo da Ford">
    <meta name="keywords" content="ford, html, css">
    <link rel="stylesheet" href="../style.css">
    <title>Ford - Lançamento</title>
</head>

<body>

    <header>
        <a href="../index.html"><img src="../public/logo-ford-256.png" alt="Ford logo"></a>
        <nav>
            <a href="../index.html">Home</a>
            <a href="./lancamento.html">Lançamento</a>
            <a href="./contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <div class="conteudo-lancamento">
            <iframe src="https://www.youtube.com/embed/vQsryuNmsL0" frameborder="0" allowfullscreen></iframe>
            
            <div class="catalogo">
                
                <figure>
                    <img src="../public/XL Cabine.jpg" alt="XL Cabine" class="product">
                    <div class="carro">
                        <input type="checkbox" name="comparar">
                        <figcaption>
                            <p class="titulo">RANGER XL Cabine Simples 2.2 Diesel</p>
                            <p>A partir de R$ 220.000</p>
                        </figcaption>
                        <img src="../public/info.png" alt="Informações" class="info">
                    </div>
                </figure>

                <figure>
                    <img src="../public/xls 2.2 diesel.jpg" alt="XLS 2.2 diesel" class="product">
                    <div class="carro">
                        <input type="checkbox" name="comparar">
                        <figcaption>
                            <p class="titulo">RANGER XLS 2.2 Diesel</p>
                            <p>A partir de R$ 245.000</p>
                        </figcaption>
                        <img src="../public/info.png" alt="Informações" class="info">
                    </div>
                </figure>

                <figure>
                    <img src="../public/storm.jpg" alt="Storm" class="product">
                    <div class="carro">
                        <input type="checkbox" name="comparar">
                        <figcaption>
                            <p class="titulo">RANGER Storm 3.2 Diesel</p>
                            <p>A partir de R$ 260.000</p>
                        </figcaption>
                        <img src="../public/info.png" alt="Informações" class="info">
                    </div>
                </figure>
                
            </div>
            
            <button type="button">Comparar Carros</button>
        </div>
    </main>

    <footer>
        <address>
            <p>Redes Sociais</p>
            <a href="https://www.facebook.com/FordBrasil/?locale=pt_BR"><img src="../public/facebook-50.png" alt="Facebook logo"></a>
            <a href="https://www.youtube.com/fordbrasil"><img src="../public/youtube-squared-50.png" alt="Youtube logo"></a>
            <a href="https://www.instagram.com/fordbrasil/"><img src="../public/instagram-logo-50.png" alt="Instagram logo"></a>
        </address>
        <img src="../public/ford-96.png" alt="Ford logo antiga">
    </footer>

</body>

</html>
